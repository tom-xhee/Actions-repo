name: Health Check Yaml
on: push

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - name: Check out repo
              uses: actions/checkout@v7
              
            - name: list the files
              run: ls -al

            - name: run the script
              run: | 
                cd health-check
                sudo chmod +x system-check.sh
                ./system-check.sh


            - name: upload the file
              uses: actions/upload-artifact@v7
              with:
                name: health-check
                path: system-check/health-check.txt